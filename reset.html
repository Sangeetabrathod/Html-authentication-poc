<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

<center>   
    <div>
        <form action="login.html">
            <h2>Reset Password</h2>   

            <!-- Email -->
            <input type="email" class="form-control" placeholder="Enter EmailId" required><br>

            <!-- Password -->
            <div class="input-group mb-3">
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                
                <span class="input-group-text" onclick="togglePassword('password','eye1')" style="cursor:pointer;">
                    <i id="eye1" class="bi bi-eye"></i>
                </span>
            </div>

            <!-- Confirm Password -->
            <div class="input-group mb-2">
                <input type="password" id="confirmPassword" name="password" class="form-control"
                    placeholder="Confirm Password" required minlength="8"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@$!%*?&]).{8,}">
                
                <span class="input-group-text" onclick="togglePassword('confirmPassword','eye2')" style="cursor:pointer;">
                    <i id="eye2" class="bi bi-eye"></i>
                </span>
            </div>

            <!-- Password Rules -->
            <p>
                Password must contain:<br>
                • At least 8 characters<br>
                • One uppercase letter<br>
                • One lowercase letter<br>
                • One number at least<br>
                • One special character (@$!%*?&)
            </p>   

            <!-- Submit -->
            <input type="submit" value="Update Password" class="btn btn-primary">

            <br><br>

            <!-- Back link -->
            <a href="login.html">Back to login page</a>
        </form>
    </div>
</center> 

<!-- JS for toggle -->
<script>
function togglePassword(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);

    if (field.type === "password") {
        field.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    } else {
        field.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}
</script>

</body>
</html>
